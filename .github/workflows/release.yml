name: release-please

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: google-github-actions/release-please-action@db8f2c60ee802b3748b512940dde88eabd7b7e01 # v3.7.13
        id: release
        with:
          release-type: simple
          pull-request-header: ":rocket: New release incoming!"
          changelog-types: '[{"type":"feat","section":"Features","hidden":false},{"type":"fix","section":"Bug Fixes","hidden":false},{"type":"chore","section":"Miscellaneous","hidden":false}]'
          extra-files: |
            README.md
            examples/aws-ecr-workflow.yml
            examples/azure-acr-workflow.yml
            examples/docker-hub-workflow.yml
            examples/ghcr-workflow.yml
            examples/google-artifact-registry-workflow.yml

      # The following steps are only executed if a release is created.
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ steps.release.outputs.release_created }}
        with:
          # Needed to push the major/minor tags below.
          persist-credentials: true
      - name: tag major and minor versions
        if: ${{ steps.release.outputs.release_created }}
        env:
          MAJOR: ${{ steps.release.outputs.major }}
          MINOR: ${{ steps.release.outputs.minor }}
        run: |
          if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid version from release-please: major='$MAJOR' minor='$MINOR'"
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -d "v${MAJOR}" || true
          git tag -d "v${MAJOR}.${MINOR}" || true
          git push origin ":v${MAJOR}" || true
          git push origin ":v${MAJOR}.${MINOR}" || true
          git tag -a "v${MAJOR}" -m "Release v${MAJOR}"
          git tag -a "v${MAJOR}.${MINOR}" -m "Release v${MAJOR}.${MINOR}"
          git push origin "v${MAJOR}"
          git push origin "v${MAJOR}.${MINOR}"
